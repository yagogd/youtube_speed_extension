<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Speed</title>
  <style>
    body { font-family: Arial, sans-serif; width:220px; padding:12px; }
    input[type="number"] { width:100%; padding:6px; box-sizing:border-box; }
    button { width:48%; padding:6px; margin-top:8px; }
    .row { display:flex; justify-content:space-between; gap:4px; }
    label { font-size:13px; }
  </style>
</head>
<body>
  <label for="speed">Velocidad (ej. 1, 1.25, 2)</label>
  <input id="speed" type="number" step="0.01" min="0.1" value="1" />
  <div class="row">
    <button id="apply">Aplicar</button>
    <button id="reset">Reset 1x</button>
  </div>
  <div style="margin-top:8px;">
    <label>Presets:</label>
    <div class="row">
      <button class="preset">0.5</button>
      <button class="preset">1.5</button>
    </div>
    <div class="row">
      <button class="preset">2</button>
      <button class="preset">2.5</button>
    </div>
    <div class="row">
      <button class="preset">3</button>
      <button class="preset">3.5</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
